{% load static %}
<section class="hero-carousel">
    <div id="mainCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <!-- Indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
        </div>

        <!-- Slides -->
        <div class="carousel-inner">
            <!-- Slide 1 -->
            <div class="carousel-item active">
                <img src="{% static 'home/img/_MG_9544.jpg' %}" class="d-block w-100" alt="Drop 001 Collection">
                <div class="carousel-caption d-none d-md-block">
                    <h2 class="display-4">DROP 001</h2>
                    <!-- <p class="lead">Featuring artists from the Bronx underground scene</p> -->
                    <a href="{% url 'drop:drop_detail' 1 %}" class="btn btn-dark btn-lg">Explorar coleccion</a>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="carousel-item">
                <img src="{% static 'home/img/entrevista_final-Cover.jpg' %}" class="d-block w-100"
                    alt="Drop 001 Collection">

                <div class="carousel-caption d-none d-md-block">
                    <h2 class="display-4">DROP 001</h2>
                    <!-- <p class="lead">Celebrating immigrant designers in Brooklyn</p> -->
                    <a href="{% url 'drop:drop_detail' 1 %}" class="btn btn-dark btn-lg">Explorar coleccion</a>
                </div>
            </div>

            <!-- Slide 3 -->
            <div class="carousel-item">

                <img src="{% static 'home/img/_MG_9546.jpg' %}" class="d-block w-100" alt="Drop 001 Collection">
                <div class="carousel-caption d-none d-md-block">
                    <h2 class="display-4">DROP 001</h2>>
                    <!-- <p class="lead">Every purchase supports marginalized creators</p> -->
                    <a href="{% url 'drop:drop_detail' 1 %}" class="btn btn-dark btn-lg">Explorar coleccion</a>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</section>
