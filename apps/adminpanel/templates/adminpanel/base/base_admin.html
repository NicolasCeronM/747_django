<!-- adminpanel/templates/adminpanel/base_admin.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | {% block title %} {% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'adminpanel/css/admin.css' %}">
    {% block css %}{% endblock %}
</head>

<body>
    <div class="admin-layout">
        {% include 'adminpanel/base/sidebar.html' %}
        {% include 'adminpanel/base/header.html' %}

        <div class="main-content">
            {% block content %}{% endblock %}


        </div>





    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <script src="{% static 'adminpanel/js/toggle_sidebar.js' %}"></script>
    {% block js %}{% endblock %}
</body>

</html>
