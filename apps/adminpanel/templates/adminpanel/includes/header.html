<!-- adminpanel/templates/adminpanel/includes/header.html -->
<header class="main-header">
    <div class="header-left">
        <h1 class="page-title" id="pageTitle">Panel de Administración</h1>
    </div>
    <div class="header-right">
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Buscar..." class="search-input">
        </div>

        <div class="header-actions">
            <button class="action-btn notification-btn">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">3</span>
            </button>

            <div class="user-menu">
                <button class="user-menu-btn">
                    <img src="https://via.placeholder.com/32x32/ff6b00/fff?text={{ request.user.first_name|first|default:'A' }}"
                        alt="Avatar" class="user-avatar-small">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="user-dropdown">
                    <a href="#" class="dropdown-item">
                        <i class="fas fa-user"></i>
                        <span>Mi perfil</span>
                    </a>
                    <a href="#" class="dropdown-item">
                        <i class="fas fa-cog"></i>
                        <span>Configuración</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="{% url 'logout' %}" class="dropdown-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Cerrar sesión</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>
